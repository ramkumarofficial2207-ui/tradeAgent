databases:
  - name: swingedge-db
    plan: free
    region: singapore

services:
  - type: web
    name: swingedge
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm run build:full
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swingedge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://swingedge.onrender.com
      - key: ADMIN_EMAILS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PAPER_TRADING_MODE
        value: "true"
      - key: ENABLE_LIVE_TRADING
        value: "false"
      - key: ENABLE_AUTOMATION
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: SCREENER_SESSION
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
