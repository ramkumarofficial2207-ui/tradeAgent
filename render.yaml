services:
  - type: web
    name: swingedge
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm run build:full
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prod.db
      - key: GEMINI_API_KEY
        sync: false
      - key: SCREENER_SESSION
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
